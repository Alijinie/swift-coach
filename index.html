<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#09090B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SwiftLink" />
  <meta name="description" content="SwiftLink Bus — Book Kampala ↔ Ibanda seats, pay with Mobile Money, scan QR tickets." />
  <title>SwiftLink Bus - Kampala ↔ Ibanda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] },
          colors: { ink: '#09090B', coal: '#131316', panel: '#1C1C1F', gold: '#FFD60A', golddeep: '#FFCC00' },
          boxShadow: { app: '0 8px 30px rgba(0,0,0,.5)', sheet: '0 -8px 30px rgba(0,0,0,.5)' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      text-rendering: optimizeLegibility;
      background: #09090B;
    }
    .press { transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease; }
    .press:active { transform: scale(.97); }
    .seat { transition: transform .12s ease, background-color .15s ease; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .seat:active { transform: scale(.9); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input, select, textarea { font-size: 16px !important; }
    @media (min-width: 768px) { input, select, textarea { font-size: 14px !important; } }
    .tabbar { padding-bottom: calc(var(--sab) + .5rem); }
    .appbar { padding-top: var(--sat); }
    .sticky-action { position: sticky; bottom: calc(4.5rem + var(--sab)); z-index: 30; }
    @media (min-width: 768px) { .sticky-action { bottom: 1rem; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .28s ease both; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } html { scroll-behavior: auto; } }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #FFD60A; outline-offset: 2px; }
    img { -webkit-user-drag: none; }
    #reader video { border-radius: .75rem; width: 100% !important; }
  </style>
</head>
<body class="bg-[#09090B] text-zinc-100 min-h-screen min-h-[100dvh]">

  <!-- TOP APP BAR -->
  <header class="appbar bg-black text-white sticky top-0 z-50 shadow-md border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex justify-between items-center gap-3 py-3">
        <div class="flex items-center gap-3 min-w-0">
          <div class="bg-[#FFD60A] text-black p-2 rounded-xl text-lg leading-none shrink-0 shadow-sm font-black" aria-hidden="true">🚌</div>
          <div class="min-w-0">
            <h1 class="font-extrabold text-[17px] sm:text-lg leading-tight truncate">SwiftLink Bus</h1>
            <p class="text-[11px] sm:text-xs text-zinc-400 truncate">Ibanda ↔ Kampala • UGX 50,000 • <span class="text-[#FFD60A] font-bold">● Live</span></p>
          </div>
        </div>
        <nav class="hidden md:flex items-center gap-2 text-sm shrink-0" aria-label="Primary">
          <button onclick="App.navigate('booking')" id="nav-booking" class="nav-btn bg-[#FFD60A] text-black font-bold px-4 py-2 rounded-full press min-h-[40px]">Book</button>
          <button onclick="App.navigate('ticket')" id="nav-ticket" class="nav-btn bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full press min-h-[40px]">My Ticket</button>
          <button onclick="App.navigate('conductor')" id="nav-conductor" class="nav-btn bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full press min-h-[40px]">Conductor</button>
          <button onclick="App.navigate('admin')" id="nav-admin" class="nav-btn bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full press min-h-[40px]">Admin</button>
        </nav>
        <div class="md:hidden shrink-0 text-[11px] bg-zinc-900 border border-zinc-800 text-[#FFD60A] px-3 py-1.5 rounded-full font-bold">Today • 5 trips</div>
      </div>
    </div>
  </header>

  <!-- APP CONTENT -->
  <main class="max-w-7xl mx-auto px-3 sm:px-4 md:p-6 pb-28 md:pb-12 pt-3 sm:pt-4 md:pt-6 w-full">
    <section id="view-booking" class="view" aria-label="Booking">
      <div id="bus-list-view"></div>
      <div id="seat-map-view" class="hidden"></div>
      <div id="payment-view" class="hidden"></div>
    </section>
    <section id="view-ticket" class="view hidden" aria-label="My ticket"></section>
    <section id="view-conductor" class="view hidden" aria-label="Conductor"></section>
    <section id="view-admin" class="view hidden" aria-label="Admin dashboard"></section>
  </main>

  <!-- BOTTOM TAB BAR -->
  <nav class="tabbar md:hidden fixed bottom-0 inset-x-0 z-50 bg-[#131316]/95 backdrop-blur-lg border-t border-zinc-800" aria-label="Mobile tabs">
    <div class="grid grid-cols-4 max-w-md mx-auto px-1 pt-1.5">
      <button onclick="App.navigate('booking')" id="tab-booking" class="tab-btn flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl min-h-[60px] text-[#FFD60A] font-bold" aria-label="Book">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M3 10h18"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/></svg>
        <span class="text-[11px] leading-none">Book</span>
      </button>
      <button onclick="App.navigate('ticket')" id="tab-ticket" class="tab-btn flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl min-h-[60px] text-zinc-500 font-semibold" aria-label="My ticket">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 5v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2.5 2.5 0 0 0 0-5z"/><path d="M13 5v2m0 4v2m0 4v2"/></svg>
        <span class="text-[11px] leading-none">Ticket</span>
      </button>
      <button onclick="App.navigate('conductor')" id="tab-conductor" class="tab-btn flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl min-h-[60px] text-zinc-500 font-semibold" aria-label="Conductor">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2m-10 0H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        <span class="text-[11px] leading-none">Scan</span>
      </button>
      <button onclick="App.navigate('admin')" id="tab-admin" class="tab-btn flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl min-h-[60px] text-zinc-500 font-semibold" aria-label="Admin">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="text-[11px] leading-none">Admin</span>
      </button>
    </div>
  </nav>

  <!-- Toast -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[60] hidden max-w-[92vw]">
    <div class="bg-[#FFD60A] text-black text-sm font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2"></div>
  </div>

  <script src="data.js"></script>
  <script src="booking.js"></script>
  <script src="payment.js"></script>
  <script src="ticket.js"></script>
  <script src="conductor.js"></script>
  <script src="admin.js"></script>
  <script src="app.js"></script>
</body>
</html>
